name: build-apk

# v5.51：NoteSync APK 构建（GitHub Actions 云构建，本机零依赖）
# 触发：push tag v* 自动产 APK + Release；workflow_dispatch 手动试跑仅产 artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要
  actions: read

jobs:
  # v10.0.0：发版闸进机器。此前 CI 只编译签名出包、不跑任何测试，「六子代理四层闸」全靠本地手动执行
  # （gate.mjs 还写死了本机 node 绝对路径）——手滑或换机就能把红版推到手机上。
  # 现在：单测不绿 → 不出包、不打 Release。e2e 需要真浏览器与本机服务器，仍留本地闸内跑。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: 物化三端壳（www/ 与 android assets 均在 .gitignore 内，全新检出不存在）
        run: |
          mkdir -p www android/app/src/main/assets/public
          cp index.html www/index.html
          cp index.html android/app/src/main/assets/public/index.html

      - name: Install test deps（--ignore-scripts 跳过 playwright 下载浏览器，单测只要 jsdom）
        working-directory: tests
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: 全量单元测试（任一红 → 本作业失败 → build 不执行 → 不出包）
        working-directory: tests
        run: node --test unit/*.test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21（Capacitor 7 硬要求：capacitor-android 源级别 21）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Capacitor deps
        run: npm ci --no-audit --no-fund

      - name: 复制 index.html → www + 同步到 android
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx cap sync android

      - name: 从 tag 注入安卓版本号（v5.56 起：versionName 永不漂移——v5.55 APK 自报 5.54 的教训）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # versionCode 通用算法：去点拼接（v6.0→60、v6.1→61），延续 v5.58=58 递增；若未来出 6.10 双位数线需再议
          CODE=$(echo "$VER" | tr -d '.')
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: 解码签名密钥库到 android/ 根（与下方 $(pwd) 路径一致）
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$B64" | base64 -d > android/notesync-release.p12

      - name: 构建 release APK
        working-directory: android
        run: |
          chmod +x gradlew   # 兜底：Windows 提交可能丢可执行位
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/notesync-release.p12 \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }} \
            --no-daemon

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteSync-${{ github.ref_name }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 生成本版更新详情（v9.3.0：VERSION_LOG 拆条 → release 正文）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 tools/gen_release_notes.py "${GITHUB_REF_NAME}" > /tmp/relnotes.md \
            || printf '## %s\n\n（本版更新详情未能自动生成，详见提交历史与 docs/VERSION_LOG.md）\n' "${GITHUB_REF_NAME}" > /tmp/relnotes.md
          head -20 /tmp/relnotes.md

      - name: 创建 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/relnotes.md
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk