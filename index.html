<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NoteSync">
<meta name="description" content="NoteSync · 端到端加密的多设备同步笔记">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg?v=5.14" type="image/svg+xml">
<title>NoteSync</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#FBFBF8; --fg:#1C1C1A; --muted:#98958A; --line:#ECEAE2;
    --accent:#8F7126; --accent-soft:rgba(143,113,38,.07); --ring:rgba(143,113,38,.16);
    --box-bg:#FFFFFF; --upload-bg:#1C1C1A; --hover:rgba(28,28,26,.05);
    --serif:Georgia,"Times New Roman","Songti SC","STSong",serif;
  }
  body.dark{
    --bg:#0F0F11; --fg:#E9E8E3; --muted:#7A786F; --line:#242428;
    --accent:#D4B068; --accent-soft:rgba(212,176,104,.08); --ring:rgba(212,176,104,.22);
    --box-bg:#17171A; --upload-bg:#E9E8E3; --hover:rgba(233,232,227,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;transition:background .3s,color .3s}
  ::selection{background:rgba(169,134,60,.22)}

  /* ── 顶栏 ───────────────────────────── */
  header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);letter-spacing:.04em}
  header .brand{display:flex;align-items:center;gap:8px;color:var(--fg);flex-shrink:0}
  header .brand svg{width:17px;height:17px;color:var(--accent)}
  header .brand b{font-family:var(--serif);font-weight:500;font-size:13.5px;letter-spacing:.06em}
  header .sp{flex:1}
  header button{display:flex;align-items:center;justify-content:center;width:31px;height:31px;color:var(--muted);background:none;border:0;border-radius:8px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:color .2s,background .2s}
  header button:hover{color:var(--fg);background:var(--hover)}
  header button svg{width:17px;height:17px;pointer-events:none}
  #versionToast{position:fixed;top:54px;left:50%;transform:translateX(-50%);z-index:60;padding:7px 14px;font-size:12px;letter-spacing:.04em;color:var(--fg);background:var(--hover);border:1px solid var(--line);border-radius:20px;opacity:0;pointer-events:none;transition:opacity .35s;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  #versionToast.show{opacity:1}
  @media (max-width:560px){ header .brand b{display:none} }

  /* ── 编辑器 ─────────────────────────── */
  #editor{flex:1;width:100%;max-width:720px;margin:0 auto;border:0;outline:0;resize:none;padding:40px 28px 120px;background:transparent;color:var(--fg);font:inherit;font-size:17px;overflow-x:hidden;overflow-y:auto;word-wrap:break-word;overflow-wrap:anywhere;word-break:break-all;white-space:pre-wrap;-webkit-user-select:text;user-select:text;line-height:1.9}
  #editor:empty:before{content:attr(data-ph);color:var(--muted);opacity:.75;pointer-events:none}
  #editor.dragover{background:var(--accent-soft);outline:1.5px dashed var(--accent);outline-offset:-8px}
  #editor img{max-width:100%;border-radius:10px;margin:6px 0;display:block;border:1px solid var(--line)}
  #editor a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(169,134,60,.35);transition:text-decoration-color .2s;word-break:break-all;overflow-wrap:break-word}
  #editor a:hover{text-decoration-color:var(--accent)}
  #editor s, #editor strike, #editor del{text-decoration:line-through;text-decoration-color:rgba(152,149,138,.7);color:var(--muted)}
  #editor p{margin:0}
  #editor::-webkit-scrollbar{width:8px}
  #editor::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  @media (max-width:560px){ #editor{padding:24px 18px 100px;font-size:16px} }

  /* ── 页脚（v5.21：纯状态条「● 状态字」，状态自顶栏移入；解锁态已由状态字编码，加密标语已在落地页/解锁弹窗表达）── */
  footer{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.14em}
  footer .dot{width:7px;height:7px;border-radius:50%;background:#C9C7BE;flex-shrink:0;transition:background .3s}
  footer .dot.on{background:#2FA866}

  /* ── 解锁弹窗 ───────────────────────── */
  .mask{position:fixed;inset:0;background:rgba(20,20,18,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:10}
  .mask.hidden{display:none!important}
  .box{background:var(--box-bg);border:1px solid var(--line);border-radius:18px;padding:34px 30px 28px;width:min(90vw,380px);box-shadow:0 24px 70px rgba(20,20,18,.16);transition:background .3s;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .box .mark{width:40px;height:40px;color:var(--accent);margin-bottom:16px}
  .box h1{font-size:18px;font-weight:600;margin:0 0 8px;letter-spacing:.02em}
  .box p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.7}
  .box input{width:100%;padding:0 14px;height:46px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:0;background:var(--bg);color:var(--fg);transition:border-color .2s,box-shadow .2s}
  .box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
  .box .err{color:#C0453E;font-size:13px;min-height:20px;margin:10px 0 6px}
  .box button{width:100%;height:46px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);font-size:15px;font-weight:500;letter-spacing:.08em;cursor:pointer;transition:opacity .2s}
  .box button:hover{opacity:.85}
  .box button:active{opacity:.75}
  /* 统一禁用态：保留品牌色但弱化（暖灰底+弱化金字），深浅色自动跟随，不破坏整体风格 */
  .box button:disabled, #landing button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none;opacity:1}
  .box button:disabled:hover, #landing button:disabled:hover{opacity:1}

  /* ── 二维码配对弹层（v5.20）─────────────────────── */
  .qr-box{text-align:center}
  .qr-box .qr-title{font-size:18px;font-weight:600;margin:0 0 8px;letter-spacing:.02em}
  .qr-box p{margin:0 0 14px}
  #qrHolder{display:flex;align-items:center;justify-content:center;min-height:236px;margin:0 0 12px}
  #qrHolder button{width:100%}
  #qrCanvas{border-radius:12px;border:1px solid var(--line);background:#fff;max-width:100%}
  .qr-warn{font-size:12px;color:#C0453E;line-height:1.65;margin:0 0 16px}
  .qr-lock-warn{font-size:13px;color:var(--muted)}

  /* ── 根路径说明 ─────────────────────── */
  .home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  .home h1{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 12px;letter-spacing:.04em}
  .home p{color:var(--muted);font-size:14px;line-height:1.9;margin:0}
  .home code{background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:6px;font-size:13px}
  .hidden{display:none!important}

  /* ── 落地页 ─────────────────────────── */
  #landing{position:fixed;inset:0;background:radial-gradient(ellipse 720px 480px at 50% 30%,var(--accent-soft),transparent),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:30}
  #landing>*{animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
  #landing>*:nth-child(2){animation-delay:.06s}
  #landing>*:nth-child(3){animation-delay:.12s}
  #landing>*:nth-child(4){animation-delay:.18s}
  #landing>*:nth-child(5){animation-delay:.24s}
  #landing .logo{width:56px;height:56px;margin:0 0 22px;color:var(--accent)}
  #landing h1{font-family:var(--serif);font-size:34px;font-weight:500;margin:0 0 10px;letter-spacing:.05em}
  #landing .sub{color:var(--muted);font-size:13px;margin:0 0 44px;letter-spacing:.32em;padding-left:.32em}
  #landing .input-row{display:flex;gap:10px;max-width:340px;width:100%}
  #landing input{flex:1;height:46px;padding:0 16px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:0;background:var(--box-bg);color:var(--fg);transition:border-color .2s,box-shadow .2s}
  #landing input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
  #landing button{height:46px;padding:0 24px;border:0;border-radius:10px;background:var(--fg);color:var(--bg);font-size:15px;font-weight:500;letter-spacing:.06em;cursor:pointer;white-space:nowrap;transition:opacity .2s}
  #landing button:hover{opacity:.85}
  #landing .warn{color:#C0453E;font-size:12px;margin:14px 0 0;letter-spacing:.04em}
  #landing .hint{color:var(--muted);font-size:12px;margin:26px 0 0;line-height:1.7;letter-spacing:.05em;opacity:.8}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ── 提示气泡 / 加载 ────────────────── */
  .upload-status{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--upload-bg);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;letter-spacing:.03em;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 10px 30px rgba(20,20,18,.2)}
  .upload-status.show{opacity:1}
  #loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:5;color:var(--muted);font-size:13px;letter-spacing:.2em}
</style>
</head>
<body>
<div id="landing" class="hidden">
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38.5 21.5A15 15 0 0 0 13 13.6"/>
    <path d="M12.5 6.5v7.5H20"/>
    <path d="M9.5 26.5A15 15 0 0 0 35 34.4"/>
    <path d="M35.5 41.5V34H28"/>
    <line x1="17.5" y1="24" x2="30.5" y2="24"/>
  </svg>
  <h1>NoteSync</h1>
  <p class="sub">端到端加密 · 多设备同步</p>
  <div class="input-row">
    <input id="landingInput" placeholder="笔记名（英文 / 数字 / _ / -）" maxlength="64" autocomplete="off">
    <button id="landingBtn" disabled>打开</button>
  </div>
  <p id="landingWarn" class="warn hidden">仅支持英文、数字、下划线和短横线</p>
  <p class="hint">在网址后加笔记名即可，如 note.xuyinji.com.cn/notes</p>
</div>
<header>
  <span class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M38.5 21.5A15 15 0 0 0 13 13.6"/><path d="M12.5 6.5v7.5H20"/><path d="M9.5 26.5A15 15 0 0 0 35 34.4"/><path d="M35.5 41.5V34H28"/><line x1="17.5" y1="24" x2="30.5" y2="24"/></svg>
    <b>NoteSync</b>
  </span>
  <span class="sp"></span>
  <button type="button" id="themeBtn" title="切换夜间模式"></button>
  <button type="button" id="strikeBtn" title="删除线"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" x2="20" y1="12" y2="12"/></svg></button>
  <button type="button" id="uploadBtn" title="上传图片"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></button>
  <button type="button" id="copyBtn" title="复制到剪贴板"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
  <button type="button" id="exportImgBtn" title="导出为图片并复制"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg></button>
  <button type="button" id="qrBtn" title="二维码配对"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="14" width="3" height="3"/><rect x="14" y="18" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/></svg></button>
  <button type="button" id="lock" title="退出锁定"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="11" x="4" y="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
</header>
<div id="editor" data-ph="开始输入，自动同步到所有设备…" contenteditable="true"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<footer id="foot"><span class="dot" id="status"></span><span id="statustext">连接中…</span></footer>
<div class="upload-status" id="uploadStatus"></div>

<div id="loading">加载中</div>

<div class="home hidden" id="home">
  <h1>NoteSync</h1>
  <p>请在 URL 后加笔记名访问，例如：<br><code>note.xuyinji.com.cn/biji</code></p>
</div>

<div class="mask hidden" id="mask">
  <div class="box">
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M38.5 21.5A15 15 0 0 0 13 13.6"/><path d="M12.5 6.5v7.5H20"/><path d="M9.5 26.5A15 15 0 0 0 35 34.4"/><path d="M35.5 41.5V34H28"/><line x1="17.5" y1="24" x2="30.5" y2="24"/></svg>
    <h1>输入访问口令</h1>
    <p>此口令用于在本机派生加密密钥，不会发送到服务器。每台新设备首次打开需输入一次，之后自动记住。</p>
    <input id="pw" type="password" autocomplete="off" autofocus>
    <div class="err" id="err"></div>
    <button id="ok" disabled>解 锁</button>
  </div>
</div>

<div class="mask hidden" id="qrMask">
  <div class="box qr-box">
    <h1 class="qr-title">扫码配对</h1>
    <p>用另一台设备扫描二维码，直接打开此笔记，无需输入口令。</p>
    <div id="qrHolder"></div>
    <p class="qr-warn">二维码包含解锁密钥，等同于口令：请只在自己的设备间扫码，勿截图或外传。</p>
    <button id="qrClose">关 闭</button>
  </div>
</div>

<script>
/* qrcode-generator v1.4.4 (c) Kazuhiko Arase — MIT License
   https://github.com/kazuhikoarase/qrcode-generator

<script>
'use strict';

// --- Cloudinary 配置（非密钥，安全） ---
const CLOUD_NAME = 'dntsgx6t3';
const UPLOAD_PRESET = 'NoteXCloudinary';
const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload';
const MAX_IMG_WIDTH = 1920;

const noteId = location.pathname.split('?')[0].replace(/^\/+|\/+$/g, '');
// 动态 manifest：让每个笔记的 start_url 指向自身路径，Chrome 安装/创建快捷方式时打开正确笔记
document.querySelector('link[rel="manifest"]').href = '/manifest.json?start=/' + encodeURIComponent(noteId);
const NOTE_API = '/api/note/' + encodeURIComponent(noteId);
const FAIL_API = '/api/fail/' + encodeURIComponent(noteId);
const KEY_STORE = 'notesync_key_' + noteId;
const PBKDF2_ITER = 200000;
const FAIL_LIMIT = 10;

// --- 版本号（彩蛋查看：连点标题栏 logo 7 次 / 地址栏加 ?about）---
const APP_VERSION = '5.21';
const BUILD_DATE = '2026-08-06';

const $ = s => document.querySelector(s);
const editor = $('#editor'), mask = $('#mask'), pw = $('#pw'), err = $('#err');
const statusEl = $('#status'), statusText = $('#statustext');
const homeEl = $('#home'), loadingEl = $('#loading');
const uploadBtn = $('#uploadBtn'), fileInput = $('#fileInput'), uploadStatus = $('#uploadStatus');
const themeBtn = $('#themeBtn');
const strikeBtn = $('#strikeBtn');
const copyBtn = $('#copyBtn'), exportImgBtn = $('#exportImgBtn');

// 输入法组字状态：组字期间（拼音未上屏）任何对选区/caret 的程序化干预都会吞字，一律跳过。
let isComposing = false;
editor.addEventListener('compositionstart', () => { isComposing = true; });
editor.addEventListener('compositionend', () => {
  isComposing = false;
  // 组字结束时 DOM 刚被 IME 改过，补一次绘制刷新（位置不动）
  try { repaintCaret(); } catch (e) {}
});

// 回车换行统一产出 <div> 块，与 cleanupLeadingTrailingBreaks / currentBlock 对块结构的预期一致
try { document.execCommand('defaultParagraphSeparator', false, 'div'); } catch (e) {}

// --- 夜间模式 ---
// 自动切换：07:00 日间，19:00 夜间（北京时间）
// 每次打开页面按时间自动设置；用户手动切换后本次会话不再自动切换，刷新后恢复
const THEME_DAY_START = 7 * 60;      // 07:00 → 420 分钟
const THEME_NIGHT_START = 19 * 60;   // 19:00 → 1140 分钟
const ICON_MOON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const ICON_SUN = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></svg>';
function shouldBeDark() {
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  return minutes < THEME_DAY_START || minutes >= THEME_NIGHT_START;
}
function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  themeBtn.innerHTML = dark ? ICON_SUN : ICON_MOON;
  // 注入 !important CSS 覆盖小米浏览器夜间模式的 CSS 注入
  let override = document.getElementById('theme-override');
  if (!override) {
    override = document.createElement('style');
    override.id = 'theme-override';
    document.head.appendChild(override);
  }
  if (dark) {
    override.textContent = `
      body{background:#0F0F11!important;color:#E9E8E3!important}
      #editor{background:transparent!important;color:#E9E8E3!important}
      header{background:#0F0F11!important;color:#7A786F!important;border-color:#242428!important}
      header button{background:none!important;color:#7A786F!important}
      footer{background:#0F0F11!important;color:#7A786F!important;border-color:#242428!important}
      .box{background:#17171A!important;color:#E9E8E3!important;border-color:#242428!important}
      .box input{background:#0F0F11!important;color:#E9E8E3!important;border-color:#242428!important}
      .box button:not(:disabled){background:#E9E8E3!important;color:#0F0F11!important}
      #landing{background:#0F0F11!important;color:#E9E8E3!important}
      #landing input{background:#17171A!important;color:#E9E8E3!important;border-color:#242428!important}
      #landing button:not(:disabled){background:#E9E8E3!important;color:#0F0F11!important}
      #loading{background:#0F0F11!important;color:#7A786F!important}
    `;
  } else {
    override.textContent = `
      body{background:#FBFBF8!important;color:#1C1C1A!important}
      #editor{background:transparent!important;color:#1C1C1A!important}
      header{background:#FBFBF8!important;color:#98958A!important;border-color:#ECEAE2!important}
      header button{background:none!important;color:#98958A!important}
      footer{background:#FBFBF8!important;color:#98958A!important;border-color:#ECEAE2!important}
      .box{background:#FFFFFF!important;color:#1C1C1A!important;border-color:#ECEAE2!important}
      .box input{background:#FBFBF8!important;color:#1C1C1A!important;border-color:#ECEAE2!important}
      .box button:not(:disabled){background:#1C1C1A!important;color:#FBFBF8!important}
      #landing{background:#FBFBF8!important;color:#1C1C1A!important}
      #landing input{background:#FFFFFF!important;color:#1C1C1A!important;border-color:#ECEAE2!important}
      #landing button:not(:disabled){background:#1C1C1A!important;color:#FBFBF8!important}
      #loading{background:#FBFBF8!important;color:#98958A!important}
    `;
  }
}
// 页面加载时按时间自动设置初始模式
applyTheme(shouldBeDark());
// 定时自动切换（用户手动切换后本次会话停止自动）
let themeAutoMode = true;
setInterval(() => {
  if (!themeAutoMode) return;
  applyTheme(shouldBeDark());
}, 60000);
themeBtn.addEventListener('click', () => {
  applyTheme(!document.body.classList.contains('dark'));
  themeAutoMode = false; // 用户手动切换后本次会话不再自动
});

// 删除线：纯 DOM Range API 操作，完全弃用 execCommand
let lastRange = null;
let strikeBusy = false;

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    if (!range.collapsed && editor.contains(range.commonAncestorContainer)) {
      lastRange = range.cloneRange();
    }

});

// 以字符偏移量保存/恢复选区：normalize() 合并文本节点后 range 引用会失效，
// 改用纯文本偏移量定位，不受 DOM 结构变化影响。
// 偏移计数无视零宽空格 \u200B：linkifyEditor 会在长词中插入 \u200B 做断行，
// 若把 \u200B 算作一个字符，save(插入前)/restore(插入后) 时点不同会导致选区漂移（见 BUG_CHECKLIST A7）。
const ZWSP = '​';
function visibleLen(s) {
  let n = 0;
  for (let i = 0; i < s.length; i++) if (s[i] !== ZWSP) n++;
  return n;
}
// 把"可见偏移"(不计 \u200B) 换算回文本节点内的真实字符偏移(含 \u200B)
function visibleToRealOffset(node, visOff) {
  let n = 0;
  const len = node.length;
  for (let i = 0; i < len; i++) {
    if (n === visOff) return i;
    if (node.nodeValue[i] !== ZWSP) n++;
  }
  return len;
}

function saveSelectionOffsets(root, range) {
  const pre = document.createRange();
  pre.selectNodeContents(root);
  pre.setEnd(range.startContainer, range.startOffset);
  const start = visibleLen(pre.toString());
  pre.setEnd(range.endContainer, range.endOffset);
  const end = visibleLen(pre.toString());
  return { start, end };
}

function restoreSelectionOffsets(root, start, end) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let pos = 0;
  let sn = null, so = 0, en = null, eo = 0;
  while (walker.nextNode()) {
    const node = walker.currentNode;
    const vlen = visibleLen(node.nodeValue);
    if (sn === null && pos + vlen >= start) { sn = node; so = visibleToRealOffset(node, start - pos); }
    if (en === null && pos + vlen >= end)   { en = node; eo = visibleToRealOffset(node, end - pos); }
    if (sn !== null && en !== null) break;
    pos += vlen;
  }
  if (sn === null || en === null) return null;
  const r = document.createRange();
  r.setStart(sn, so);
  r.setEnd(en, eo);
  return r;
}

function applyStrike() {
  if (strikeBusy) return;
  if (!lastRange || lastRange.collapsed) return;

  let startNode = lastRange.startContainer;
  let endNode = lastRange.endContainer;
  if (!startNode || !endNode || !editor.contains(startNode) || !editor.contains(endNode)) {
    lastRange = null;
    return;
  }

  strikeBusy = true;
  setTimeout(() => { strikeBusy = false; }, 300);

  const range = lastRange.cloneRange();
  const htmlBefore = editor.innerHTML;

  let savedOffsets = null;
  try {
    savedOffsets = saveSelectionOffsets(editor, range);
  } catch (e) {}

  try {
    let container = range.commonAncestorContainer;
    if (container.nodeType === 3) container = container.parentNode;
    const ancestorInS = !!(container.closest && container.closest('s'));
    const preview = range.cloneContents();
    const contentHasS = Array.from(preview.querySelectorAll('s')).some(s => s.textContent.length > 0);
    const hasStrike = ancestorInS || contentHasS;

    if (hasStrike) {
      removeStrikeFromRange(range);
    } else {
      addStrikeToRange(range);
    }

    editor.querySelectorAll('s').forEach(sTag => {
      if (!sTag.textContent.trim() && !sTag.querySelector('img')) {
        const p = sTag.parentNode;
        while (sTag.firstChild) p.insertBefore(sTag.firstChild, sTag);
        p.removeChild(sTag);
      }
    });

    editor.normalize();
  } catch (e) {
    console.error('strike DOM operation failed:', e);
  }

  if (editor.innerHTML !== htmlBefore) {
    try {
      if (savedOffsets) {
        const newRange = restoreSelectionOffsets(editor, savedOffsets.start, savedOffsets.end);
        if (newRange) {
          const sel = window.getSelection();
          setSel(newRange);
          lastRange = newRange.cloneRange();
        }
      }
    } catch (e) {
      lastRange = null;
    }
    editor.dispatchEvent(new Event('input'));
  }
}

// rangeIntersectsNode：替代原生 intersectsNode，修复边界恰好等于节点末尾时返回 false 的问题
// 场景：restoreSelectionOffsets 恢复选区后，边界可能落在文本节点末尾（offset === length），
// 原生 intersectsNode 此时返回 false，导致 addStrikeToRange 跳过该节点
function rangeIntersectsNode(range, node) {
  const nodeRange = document.createRange();
  nodeRange.selectNodeContents(node);
  return range.compareBoundaryPoints(Range.START_TO_END, nodeRange) >= 0 &&
         range.compareBoundaryPoints(Range.END_TO_START, nodeRange) <= 0;
}

// 添加删除线：逐个文本节点包裹 <s>，保留 div/br 等块级结构不变
function addStrikeToRange(range) {
  const textNodes = [];
  const walkerRoot = range.commonAncestorContainer.nodeType === 3
    ? range.commonAncestorContainer.parentNode
    : range.commonAncestorContainer;
  const walker = document.createTreeWalker(
    walkerRoot,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode: node => {
        if (!editor.contains(node)) return NodeFilter.FILTER_REJECT;
        if (node.parentElement && node.parentElement.closest('s')) return NodeFilter.FILTER_REJECT;
        if (!rangeIntersectsNode(range, node)) return NodeFilter.FILTER_SKIP;
        if (node.length === 0) return NodeFilter.FILTER_SKIP;
        return NodeFilter.FILTER_ACCEPT;
      }
    }
  );
  while (walker.nextNode()) textNodes.push(walker.currentNode);

  for (let i = textNodes.length - 1; i >= 0; i--) {
    const node = textNodes[i];
    let startOff = 0;
    let endOff = node.length;
    if (node === range.startContainer) startOff = range.startOffset;
    if (node === range.endContainer) endOff = range.endOffset;
    if (startOff >= endOff) continue;

    let workNode = node;
    if (endOff < node.length) node.splitText(endOff);
    if (startOff > 0) {
      node.splitText(startOff);
      workNode = node.nextSibling;
    }

    const s = document.createElement('s');
    workNode.parentNode.insertBefore(s, workNode);
    s.appendChild(workNode);
  }
}

// 取消删除线：完全覆盖时展平 <s>，部分覆盖时只移出选区内文本
function removeStrikeFromRange(range) {
  const sTags = [];
  const walkerRoot = range.commonAncestorContainer.nodeType === 3
    ? range.commonAncestorContainer.parentNode
    : range.commonAncestorContainer;
  const walker = document.createTreeWalker(
    walkerRoot,
    NodeFilter.SHOW_ELEMENT,
    {
      acceptNode: n => (n.tagName === 'S' || n.tagName === 'STRIKE') && rangeIntersectsNode(range, n)
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP
    }
  );
  while (walker.nextNode()) sTags.push(walker.currentNode);

  let container = range.commonAncestorContainer;
  if (container.nodeType === 3) container = container.parentNode;
  let ancestorS = container;
  while (ancestorS && ancestorS !== editor) {
    if (ancestorS.tagName === 'S' || ancestorS.tagName === 'STRIKE') {
      if (sTags.indexOf(ancestorS) === -1) sTags.unshift(ancestorS);
      break;
    }
    ancestorS = ancestorS.parentNode;
  }

  for (const sTag of sTags) {
    const sRange = document.createRange();
    sRange.selectNodeContents(sTag);
    const fullyCovered =
      range.compareBoundaryPoints(Range.START_TO_START, sRange) <= 0 &&
      range.compareBoundaryPoints(Range.END_TO_END, sRange) >= 0;

    if (fullyCovered) {
      const p = sTag.parentNode;
      while (sTag.firstChild) p.insertBefore(sTag.firstChild, sTag);
      p.removeChild(sTag);
      continue;
    }

    const innerTextNodes = [];
    const innerWalker = document.createTreeWalker(
      sTag,
      NodeFilter.SHOW_TEXT,
      { acceptNode: node => rangeIntersectsNode(range, node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP }
    );
    while (innerWalker.nextNode()) innerTextNodes.push(innerWalker.currentNode);

    for (let i = innerTextNodes.length - 1; i >= 0; i--) {
      const textNode = innerTextNodes[i];
      let startOff = 0;
      let endOff = textNode.length;
      if (textNode === range.startContainer) startOff = range.startOffset;
      if (textNode === range.endContainer) endOff = range.endOffset;
      if (startOff >= endOff) continue;

      let workNode = textNode;
      if (endOff < textNode.length) textNode.splitText(endOff);
      if (startOff > 0) {
        textNode.splitText(startOff);
        workNode = textNode.nextSibling;
      }

      moveNodeOutOfS(workNode, sTag);
    }
  }
}

// 将节点从 <s> 中移出：首位前移、末位后移、中间位置拆分 <s>
function moveNodeOutOfS(node, sTag) {
  const sParent = sTag.parentNode;
  const isFirst = (node === sTag.firstChild);
  const isLast = (node === sTag.lastChild);

  if (isFirst && isLast) {
    sParent.insertBefore(node, sTag);
    sParent.removeChild(sTag);
  } else if (isFirst) {
    sParent.insertBefore(node, sTag);
  } else if (isLast) {
    sParent.insertBefore(node, sTag.nextSibling);
  } else {
    const newS = document.createElement('s');
    let sibling = node.nextSibling;
    while (sibling) {
      const next = sibling.nextSibling;
      newS.appendChild(sibling);
      sibling = next;
    }
    sParent.insertBefore(node, sTag.nextSibling);
    sParent.insertBefore(newS, node.nextSibling);
  }
}

const b64ToBuf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// --- 加解密 ---
async function deriveKey(pass, saltBuf) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBuf, iterations: PBKDF2_ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
  );
}
async function encryptText(text, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
  return { ct: bufToB64(ct), iv: bufToB64(iv) };
}
async function decryptText(ctB64, ivB64, key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(ivB64) }, key, b64ToBuf(ctB64));
  return new TextDecoder().decode(pt);
}
// --- URL-safe Base64（v5.20 二维码配对）---
// 配对链接在 URL fragment（#k=...）里携带 AES 密钥；标准 base64 的 + / = 在 URL 中
// 会被百分号编码或解析改写，统一改用 URL-safe 变体（-_、无填充），解析时还原。
function b64ToUrlSafe(b64) { return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function urlSafeToB64(s) {
  let b = s.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  return b;
}

// --- API（含自动重试） ---
async function fetchRetry(url, opts, retries) {
  for (let i = 0; i <= retries; i++) {
    try {
      const r = await fetch(url, opts);
      if (r.status === 429) { const j = await r.json(); throw { locked: true, retryAfter: j.retryAfter || 1800 }; }
      if (!r.ok) {
        const err = new Error((opts?.method||'GET') + ' ' + r.status);
        err.status = r.status;
        throw err;
      }
      return r;
    } catch (e) {
      if (e.locked || (e.status >= 400 && e.status < 500)) throw e;
      if (i < retries) { await new Promise(r => setTimeout(r, [1000, 3000, 5000][i] || 5000)); continue; }
      throw e;
    }
  }
}
async function apiGet() {
  const r = await fetchRetry(NOTE_API, { cache: 'no-store' }, 2);
  return r.json();
}
async function apiPut(obj) {
  const r = await fetchRetry(NOTE_API, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) }, 2);
  return r.json();
}
async function reportFail() {
  try {
    const r = await fetch(FAIL_API, { method: 'POST' });
    const j = await r.json();
    if (r.status === 429 || j.locked) { err.textContent = '尝试过多，请 ' + fmtRetry(j.retryAfter || 1800) + ' 后再试'; return; }
    const left = FAIL_LIMIT - (j.count || 0);
    if (left > 0 && left <= 3) err.textContent = '口令错误，解密失败（剩余 ' + left + ' 次尝试）';
    else err.textContent = '口令错误，解密失败';
  } catch (e) { err.textContent = '口令错误，解密失败'; }
}

// --- 图片上传 ---
async function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > MAX_IMG_WIDTH) { h = Math.round(h * MAX_IMG_WIDTH / w); w = MAX_IMG_WIDTH; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => { if (!blob) { reject(new Error('compress failed')); return; } resolve(blob); }, 'image/jpeg', 0.85);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadToCloudinary(blob) {
  const formData = new FormData();
  formData.append('file', blob);
  formData.append('upload_preset', UPLOAD_PRESET);
  const r = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
  if (!r.ok) throw new Error('Upload failed: ' + r.status);
  const j = await r.json();
  return j.secure_url;
}

// 在光标处插入图片
function insertImageAtCursor(url) {
  editor.focus();
  const sel = window.getSelection();
  if (!sel.rangeCount) { editor.innerHTML += '<img src="' + url + '"><br>'; return; }
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const img = document.createElement('img');
  img.src = url;
  range.insertNode(img);
  range.collapse(false);
  setSel(range);
  editor.dispatchEvent(new Event('input'));
}

async function handleImageUpload(file) {
  if (!file || !file.type.startsWith('image/')) return;
  showUploadStatus('正在压缩图片…');
  try {

    showUploadStatus('正在上传…');
    const url = await uploadToCloudinary(blob);
    insertImageAtCursor(url);
    showUploadStatus('上传成功');

}

// 在光标处插入节点：基于 Selection/Range，不依赖已废弃的 execCommand，
// 避免 execCommand 在光标异常时插入失败 / 退化为纯文本（见 BUG_CHECKLIST E2）。
function insertNodeAtCaret(node) {
  editor.focus();
  const sel = window.getSelection();
  let range;
  if (sel.rangeCount > 0) {
    range = sel.getRangeAt(0);
    try { range.deleteContents(); } catch (e) {}
  }
  // 选区可能指向已被清空的节点（如清空空编辑器占位 <br> 后），重建到末尾
  if (!range || !range.startContainer || !range.startContainer.isConnected) {
    range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
  }
  // 纯文本直接插入到编辑器根（空编辑器粘贴）时，包进 <div> 以匹配浏览器原生输入结构。
  // 否则编辑器根下出现裸文本节点，contenteditable 视为非法结构，Chromium 会不绘制光标
  // （粘贴"一二三"→选中按空格后光标不可见，F7）。块内/段中插入不改变结构，不包。
  if (node.nodeType === 3 && range.startContainer === editor) {
    const div = document.createElement('div');
    div.appendChild(node);
    node = div;
  }
  range.insertNode(node);
  range.collapse(false);
  setSel(range);
  editor.dispatchEvent(new Event('input'));
}

// 安全设置选区：用 setBaseAndExtent / collapse 一次性设置，绝不 removeAllRanges()+addRange()。
// 旧的“清空所有选区再重加”写法会打断 Chromium 原生撤销事务分组，导致 Ctrl+Z 失效（F11 教训）。
function setSel(range) {
  const sel = window.getSelection();
  try { sel.setBaseAndExtent(range.startContainer, range.startOffset, range.endContainer, range.endOffset); } catch (e) {}
}
function setCaret(node, offset) {
  const sel = window.getSelection();
  try { sel.collapse(node, offset); } catch (e) {}
}

// ── 自建撤销栈（Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z）────────────────────────
// 为什么放弃浏览器原生 UndoManager：
//  1) 原生栈无法"选择性排除"——linkify 的程序化 DOM 手术、poll 的整段 innerHTML 替换
//     都会各自塞进原生撤销栈，用户按一次 Ctrl+Z 要穿透好几个"看不见"的程序化改动，
//     表现为「按了没反应 / 回退的不是上一步」（Bug A）。
//  2) 实测 Chromium 在 contentEditable=false↔true 切换时会清空整个原生撤销栈
//     （曾试过用 toggle 规避，结果更糟：Ctrl+Z 彻底失效）。
// 故改为自建栈：用户真实编辑（input 事件）压入快照；程序化改动（linkify / poll 同步）
// 只"同步"当前快照而不压栈，Ctrl+Z 永远命中用户的上一步。
let undoStack = [];
let redoStack = [];
let lastState = null;        // 当前已提交状态 {html, sel}
let isRestoring = false;     // 撤销/重做恢复 DOM 期间，屏蔽 recordIfChanged
let lastEditTime = 0;
let lastEditType = '';

function captureState() {
  const sel = window.getSelection();
  let selOff = null;
  if (sel.rangeCount > 0) {
    const r = sel.getRangeAt(0);
    if (editor.contains(r.commonAncestorContainer)) {
      try { selOff = saveSelectionOffsets(editor, r); } catch (e) {}
    }
  }
  return { html: editor.innerHTML, sel: selOff };
}

function applyState(s) {
  isRestoring = true;
  try {
    editor.innerHTML = s.html;
    if (s.sel) {
      const r = restoreSelectionOffsets(editor, s.sel.start, s.sel.end);
      if (r) setSel(r);
    }
  } finally {
    isRestoring = false;
  }
  lastState = captureState();
}

// 用户编辑：内容变化则压入"上一步"快照。同一输入突发内的连续打字合并为一步（贴近 Chrome）。
function recordIfChanged(it) {
  if (isRestoring || isComposing || pasteInFlight) return;
  let cur;
  try { cur = captureState(); } catch (e) { return; }
  const now = Date.now();
  const isTyping = it === 'insertText' || it === 'insertCompositionText';
  if (lastState && cur.html !== lastState.html) {
    const prevTyping = lastEditType === 'insertText' || lastEditType === 'insertCompositionText';
    const coalesce = isTyping && prevTyping && (now - lastEditTime < 700);
    if (!coalesce) {
      undoStack.push(lastState);
      if (undoStack.length > 300) undoStack.shift();
      redoStack = [];
    }
    lastState = cur;
    lastEditTime = now;
    lastEditType = it || 'other';
  } else if (cur.sel && lastState && lastState.sel &&
             (cur.sel.start !== lastState.sel.start || cur.sel.end !== lastState.sel.end)) {
    // 仅光标移动、内容未变：更新当前状态的选区，不新增撤销条目（移动光标不可撤销）
    lastState = cur;
  }
}

// 程序化改动（linkify / poll 远端同步）调用：把当前内容"同步"为已提交状态，不压栈，
// 避免把程序化改动混入用户撤销序列。
function syncCurrentState() {
  let cur;
  try { cur = captureState(); } catch (e) { return; }
  if (!lastState || cur.html !== lastState.html) {
    lastState = cur;
    redoStack = [];
  }
}

function undo() {
  if (undoStack.length === 0) return;
  const prev = undoStack.pop();
  redoStack.push(lastState);
  applyState(prev);
  try { ensureCaret(true); } catch (e) {}
}
function redo() {
  if (redoStack.length === 0) return;
  const next = redoStack.pop();
  undoStack.push(lastState);
  applyState(next);
  try { ensureCaret(true); } catch (e) {}
}

// 调试钩子（仅供自动化探针读取/重置，无业务副作用）
window.__undoState = () => ({ u: undoStack.length, r: redoStack.length, html: editor.innerHTML });
window.__undoReset = () => { undoStack = []; redoStack = []; lastState = captureState(); };
// 选区边界溢出判定的测试钩子（仅供自动化探针调用，无业务副作用）
window.__isOverflowSelection = isOverflowSelection;
window.__clampOverflowSelection = clampOverflowSelection;

// ── Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z 键盘拦截 ──
editor.addEventListener('keydown', e => {
  if (isComposing) return;
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = (e.key || '').toLowerCase();
  if (k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  else if (k === 'y') { e.preventDefault(); redo(); }
});

// ── 三击行选"边界溢出"钳制（修复：选中第一行 + 空格 → 第二行被拽上来）──
// Chromium 三击选中一行时，选区终点会落在"下一行块的起点(offset 0)"，
// 选区把两块之间的边界也包了进去；随后任何替换/删除选区都会吞掉块边界、
// 把下一行内容合并上来（用户报：第一行 一二三四五六 + 第二行 七，三击第一行按空格→" 七"）。
// 这里检测该"边界溢出"模式并钳制回当前块末尾，使替换只影响当前行、保留块结构。
// 判定很窄：终点在紧随其后的兄弟块起点 + 该块无任何内容被选中 + 正向溢出，
// 不会误伤正常跨行拖选（那种情况终点在文字里、且选中了下一行内容）。
function isOverflowSelection(range) {
  if (!range || range.collapsed) return false;
  const startBlock = blockOf(range.startContainer, editor);
  const endBlock = blockOf(range.endContainer, editor);
  if (startBlock === editor || endBlock === editor || startBlock === endBlock) return false;
  // 终点是否正好落在 endBlock 的起点（即未选中 endBlock 任何内容）
  let atStart = false;
  try {
    const p = document.createRange();
    p.selectNodeContents(endBlock);
    p.setStart(range.endContainer, range.endOffset);
    atStart = (p.toString() === (endBlock.textContent || ''));
  } catch (e) { return false; }
  if (!atStart) return false;
  // 正向溢出：startBlock 必须在 endBlock 之前（避免干扰反向选择）
  return !!(endBlock.compareDocumentPosition(startBlock) & Node.DOCUMENT_POSITION_PRECEDING);
}
function clampOverflowSelection() {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return false;
  const r = sel.getRangeAt(0);
  if (!isOverflowSelection(r)) return false;
  const startBlock = blockOf(r.startContainer, editor);
  const tail = document.createRange();
  tail.selectNodeContents(startBlock);
  tail.collapse(false); // 收回到 startBlock 末尾
  try {
    r.setEnd(tail.endContainer, tail.endOffset);
    sel.removeAllRanges();
    sel.addRange(r);
  } catch (e) { return false; }
  return true;
}
document.addEventListener('selectionchange', () => {
  if (document.activeElement !== editor || isComposing || isRestoring) return;
  clampOverflowSelection();
});

// 编辑器是否"空"：仅含浏览器在空 contenteditable 里塞的占位 <br> 或纯空白，无任何实质内容
function isEditorEmpty() {
  if (editor.querySelector('img,a,s')) return false;
  const txt = (editor.textContent || '').replace(/\u200B/g, '').trim();
  return txt.length === 0;
}
// 是否存在可被 linkify 处理的文本（URL / 手机号 / 超长词）
function hasLinkableText(root, urlTest, phoneTest, longWordTest) {
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while (n = tw.nextNode()) {
    const v = n.nodeValue || '';
    if (urlTest.test(v) || phoneTest.test(v) || longWordTest.test(v)) return true;
  }
  return false;
}

// 粘贴：图片→上传，文字→纯文本（URL/手机号自动转链接）
editor.addEventListener('paste', e => {
  if (isComposing) return; // 组字期间不处理粘贴，避免打断 IME
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      handleImageUpload(item.getAsFile());
      return;
    }
  }
  // 文字：优先 text/plain，回退到 text/uri-list（部分环境复制链接只有 uri-list）
  const text = e.clipboardData.getData('text/plain') || e.clipboardData.getData('text/uri-list') || '';
  if (!text) return;
  e.preventDefault();
  // 空编辑器（仅 <br>/纯空白）：清掉占位 <br> 后整段按行拆成 <div> 块
  // （若走原生 insertText，空编辑器的占位 <br> 会残留成顶部空行，即用户报的“粘贴多出一个空行”）
  if (isEditorEmpty()) {
    const lines = text.split(/\r?\n/);
    const frag = document.createDocumentFragment();
    lines.forEach(line => {
      const d = document.createElement('div');
      d.textContent = line;
      frag.appendChild(d);
    });
    editor.innerHTML = '';
    insertNodeAtCaret(frag);
    return;
  }
  pasteTextNative(text);
});

// I2：非空编辑器粘贴——用原生 execCommand 逐行插入，与当前行正确合并。
// 旧实现把每一行无条件包成 <div> 块再 insertNode：在 "abc|def" 中间粘贴 "XY"
// 会产生嵌套 <div>（abc/XY/def 渲染成三行），且光标落到块首（接着打字出现在行首）。
// insertText 在光标处内联合并，insertParagraph 走浏览器原生拆段，光标位置天然正确。
// 整个粘贴作为单步压入自建撤销栈（pasteInFlight 期间 recordIfChanged 不逐条记录）。
let pasteInFlight = false;
function pasteTextNative(text) {
  const lines = text.split(/\r?\n/);
  editor.focus();
  const prePaste = captureState();
  pasteInFlight = true;
  try {
    lines.forEach((line, i) => {
      if (i > 0) document.execCommand('insertParagraph', false);
      if (line) document.execCommand('insertText', false, line);
    });
  } finally {
    pasteInFlight = false;
  }
  undoStack.push(prePaste);
  if (undoStack.length > 300) undoStack.shift();
  redoStack = [];
  // 结构整理（独立验证发现）：单行笔记的常见形态是"裸文本节点挂根"（空编辑器首行打字
  // Chromium 不包 div），此时行中粘贴多行文本，insertParagraph 会留下「裸文本节点 + <div>
  // 做兄弟」的非法结构（如 abX<div>Yc</div>）。无可链接文本时 linkifyEditor 早退不碰 DOM，
  // 该结构会以该形态保存/同步，且在其上回车会产生真嵌套块。这里在 undo 压栈后补一次包块+
  // normalize（只移动/合并节点、不压撤销栈），并重新捕获当前态，避免 recordIfChanged 误判。
  // 注意：ensureBlockWrapped 会把光标所在的裸文本节点搬进新 <div>，父节点变更会让 Chromium
  // 把选区折叠成元素偏移、光标丢失。故先用"块内偏移"保存选区、整理后再恢复（同 linkifyEditor），
  // 保证光标停在粘贴内容之后、而不是跳到行尾。
  const sel0 = window.getSelection();
  let savedSel = null;
  if (sel0.rangeCount > 0) {
    const r0 = sel0.getRangeAt(0);
    if (editor.contains(r0.commonAncestorContainer)) {
      try { savedSel = saveSelectionBlocked(editor, r0); } catch (e) {}
    }
  }
  ensureBlockWrapped();
  editor.normalize();
  if (savedSel) {
    try {
      const nr = restoreSelectionInBlock(editor, savedSel);
      if (nr) setSel(nr);
    } catch (e) {}
  }
  lastState = captureState();
  lastEditTime = Date.now();
  lastEditType = 'insertFromPaste';
  try { ensureCaret(true); } catch (e) {}
  // execCommand 派发的 input 事件若撞上 busy 会被提前跳过，这里保底挂一次保存/linkify
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLocal, 800);
  clearTimeout(linkifyTimer);
  linkifyTimer = setTimeout(linkifyEditor, 500);
}

// 拖拽图片
editor.addEventListener('dragover', e => { e.preventDefault(); editor.classList.add('dragover'); });
editor.addEventListener('dragleave', () => editor.classList.remove('dragover'));
editor.addEventListener('drop', e => {
  e.preventDefault();
  editor.classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (files && files.length > 0) handleImageUpload(files[0]);
});

// 点击链接：tel: 拨号，URL 在新标签页打开（mousedown 阶段拦截，防止光标落入编辑）
editor.addEventListener('mousedown', e => {
  const a = e.target.closest('a');
  if (a) {
    e.preventDefault();
    if (a.href.startsWith('tel:')) {
      location.href = a.href;
    } else {
      window.open(a.href, '_blank', 'noopener,noreferrer');
    }
  }
});

// 文件选择上传
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if (e.target.files && e.target.files[0]) handleImageUpload(e.target.files[0]);
  e.target.value = '';
});

// --- 复制到剪贴板 ---
copyBtn.addEventListener('click', async () => {
  try {
    // ZWSP（\u200B）仅用于编辑器内长词/链接断行，复制出去会污染其它应用，剥离
    const html = editor.innerHTML.replace(/\u200B/g, '');
    const text = editor.innerText.replace(/\u200B/g, '');
    const item = new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([text], { type: 'text/plain' })
    });
    await navigator.clipboard.write([item]);
    showUploadStatus('已复制到剪贴板');
  } catch (e) {
    try {
      await navigator.clipboard.writeText(editor.innerText.replace(/\u200B/g, ''));
      showUploadStatus('已复制文字');
    } catch (e2) {
      showUploadStatus('复制失败');
    }
  }
  setTimeout(hideUploadStatus, 2000);
});

// --- 导出为图片并复制 ---
async function exportImage() {
  if (typeof html2canvas === 'undefined') {
    showUploadStatus('图片导出组件未加载');
    setTimeout(hideUploadStatus, 2000);
    return;
  }
  showUploadStatus('正在生成图片…');

  const cs = getComputedStyle(editor);
  const tmp = document.createElement('div');
  tmp.style.cssText = 'position:absolute;left:-9999px;top:0;width:' + editor.clientWidth + 'px;padding:' + cs.padding + ';font:' + cs.font + ';line-height:2.2;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;background:' + cs.backgroundColor + ';color:' + cs.color;
  tmp.innerHTML = editor.innerHTML;

  tmp.querySelectorAll('a').forEach(a => {
    a.replaceWith(document.createTextNode(a.textContent.replace(/\u200B/g, '')));
  });

  const breakLongWords = s =>
    s.replace(/\u200B/g, '')
     .replace(/(\S{15,})/g, m =>
       m.replace(/([\/.?:=&#_%-])/g, '$1 ')
     );

  const textNodes = [];
  const walker = document.createTreeWalker(tmp, NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach(textNode => {
    const text = textNode.nodeValue;
    if (!text) return;
    textNode.nodeValue = breakLongWords(text);
  });

  document.body.appendChild(tmp);

  await new Promise(r => setTimeout(r, 50));

  try {
    const canvas = await html2canvas(tmp, {
      backgroundColor: getComputedStyle(document.body).backgroundColor,
      scale: 2,
      useCORS: true,
      logging: false,
      width: tmp.scrollWidth,
      height: tmp.scrollHeight,
      windowWidth: tmp.scrollWidth,
      windowHeight: tmp.scrollHeight
    });
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (navigator.clipboard && navigator.clipboard.write && typeof ClipboardItem !== 'undefined') {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      showUploadStatus('图片已复制，可直接 Ctrl+V 粘贴');
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'note.png';
      a.click();
      URL.revokeObjectURL(url);
      showUploadStatus('图片已下载');
    }
  } catch (e) {
    const msg = e.name === 'SecurityError' ? '导出失败：可能因外链图片跨域，请使用支持CORS的图床' : '导出失败：' + e.message;
    showUploadStatus(msg);
  } finally {
    document.body.removeChild(tmp);
  }
  setTimeout(hideUploadStatus, 3000);
}

if (window.PointerEvent) {
  exportImgBtn.addEventListener('pointerdown', e => { if (e.button !== 0) return; e.preventDefault(); exportImage(); });
} else {
  exportImgBtn.addEventListener('touchstart', e => { e.preventDefault(); exportImage(); }, { passive: false });
}
exportImgBtn.addEventListener('click', e => { e.preventDefault(); if (!window.PointerEvent) exportImage(); });

// --- 二维码配对 · 发送端弹层（v5.20 引入；v5.21 改直出：打开即显示二维码，去掉配对链接行）---
const qrBtn = $('#qrBtn'), qrMask = $('#qrMask'), qrHolder = $('#qrHolder');
let qrHideTimer = null;
function buildPairingUrl() {
  const b64 = localStorage.getItem(KEY_STORE); // 解锁时已写入的 AES 密钥（raw base64）
  if (!b64) return null;
  const BRIDGE_URL = 'https://zchening.github.io/NoteSync/bridge.html';
  const target = location.origin + '/' + encodeURIComponent(noteId);
  return BRIDGE_URL + '#t=' + encodeURIComponent(target) + '&k=' + b64ToUrlSafe(b64);
}
function drawQrTo(canvas, text) {
  const qr = qrcode(0, 'M'); // typeNumber=0 自动选版本；纠错级别 M
  qr.addData(text, 'Byte');
  qr.make();
  const n = qr.getModuleCount(), scale = 5, quiet = scale * 4; // 4 模块静区
  const size = n * scale + quiet * 2;
  canvas.width = size; canvas.height = size;
  const shown = Math.min(size, 260);
  canvas.style.width = shown + 'px'; canvas.style.height = shown + 'px';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#111111';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (qr.isDark(r, c)) ctx.fillRect(quiet + c * scale, quiet + r * scale, scale, scale);
}
function resetQrHolder() { // 复位：锁定态显示提示，否则给"重新显示"按钮（60s 自动隐藏后的入口），不让二维码常驻屏幕
  clearTimeout(qrHideTimer); qrHideTimer = null;
  qrHolder.innerHTML = '';
  if (!cryptoKey) {
    const hint = document.createElement('p');
    hint.className = 'qr-lock-warn';
    hint.textContent = '解锁后才可使用二维码配对';
    qrHolder.appendChild(hint);
    return;
  }
  const btn = document.createElement('button');
  btn.type = 'button'; btn.id = 'qrReveal'; btn.textContent = '重新显示';
  btn.addEventListener('click', revealQr);
  qrHolder.appendChild(btn);
}
async function revealQr() {
  let url = buildPairingUrl();
  if (!url && cryptoKey) { // KEY_STORE 缺失但内存有密钥（部分清理数据/解锁时写入失败）：重新导出补写，不做哑按钮
    try {
      const raw = await crypto.subtle.exportKey('raw', cryptoKey);
      localStorage.setItem(KEY_STORE, bufToB64(raw));
      url = buildPairingUrl();
    } catch (e) {}
  }
  if (!url) { // 兜底后仍拿不到密钥：给出明确提示而非静默无反应
    qrHolder.innerHTML = '';
    const hint = document.createElement('p');
    hint.className = 'qr-lock-warn';
    hint.textContent = '无法读取本机密钥，请退出锁定后重新解锁再配对';
    qrHolder.appendChild(hint);
    return;
  }
  qrHolder.innerHTML = '';
  const cv = document.createElement('canvas');
  cv.id = 'qrCanvas';
  try { drawQrTo(cv, url); } catch (e) { resetQrHolder(); return; }
  qrHolder.appendChild(cv);
  clearTimeout(qrHideTimer);
  qrHideTimer = setTimeout(resetQrHolder, 60000); // 60 秒自动隐藏，缩短密钥暴露窗口
}
qrBtn.addEventListener('click', () => { // v5.21 直出：打开弹层即渲染二维码，无需二次点击
  qrMask.classList.remove('hidden');
  if (!cryptoKey) { resetQrHolder(); return; } // 锁定态：显示"解锁后才可用"提示
  revealQr();
});
$('#qrClose').addEventListener('click', () => { resetQrHolder(); qrMask.classList.add('hidden'); });

// --- 解锁 ---
async function applyUnlocked(key, note) {
  cryptoKey = key;
  try {
    const raw = await crypto.subtle.exportKey('raw', key);
    localStorage.setItem(KEY_STORE, bufToB64(raw));
  } catch (e) {}
  localVer = note.v || 0;
  mask.classList.add('hidden');
  editor.contentEditable = true;
  if (note.ct) { try { lastHtml = await decryptText(note.ct, note.iv, key); editor.innerHTML = lastHtml; } catch (e) {} }
  ensureBlockWrapped();
  if (note.ct) { try { linkifyEditor(); } catch (e) {} }
  ensureCaret(); // 关键：解密内容载入后显式重建合法折叠光标（避免"解锁后无光标/无法输入"）
  undoStack = []; redoStack = []; lastState = captureState(); // 新笔记会话：清空并重置撤销栈基线
  startSync();
}

async function unlock(pass) {
  err.textContent = '';
  if (!pass) { err.textContent = '请输入口令'; return; }
  let note;
  try { note = await apiGet(); }
  catch (e) {
    if (e.locked) { err.textContent = '尝试过多，请 ' + fmtRetry(e.retryAfter) + ' 后再试'; return; }
    if (e.status === 400) { err.textContent = '笔记名不合法（仅英文、数字、下划线、短横线）'; return; }
    err.textContent = '无法连接服务器'; return;
  }
  serverSalt = note.salt ? b64ToBuf(note.salt) : crypto.getRandomValues(new Uint8Array(16));
  let key;
  try { key = await deriveKey(pass, serverSalt); } catch (e) { err.textContent = '派生密钥失败'; return; }
  if (note.ct) {
    try { await decryptText(note.ct, note.iv, key); }
    catch (e) { await reportFail(); return; }
  }
  if (!note.salt) { try { await apiPut({ ct: '', iv: '', salt: bufToB64(serverSalt) }); } catch (e) {} }
  await applyUnlocked(key, note);
}

async function loadStoredKey() {
  const b64 = localStorage.getItem(KEY_STORE);
  if (!b64) return false;
  try {
    const key = await crypto.subtle.importKey('raw', b64ToBuf(b64), { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
    cryptoKey = key; return true;
  } catch (e) { localStorage.removeItem(KEY_STORE); return false; }
}

// --- 二维码配对 · 快速配对接收端（v5.20）---

// 刷新 → 用户看到「能打字但没有光标」。headless 不做真实合成，此现象测不出来。
// 手段选择：只改 caret-color 触发 paint invalidation，跨一帧后还原。
//   * 不用 blur()+focus()：会打断中文输入法组字（吞拼音），代价不可接受。
//   * 不改 DOM：避免动撤销栈与块结构（F9 的教训）。
function repaintCaret() {
  if (!editor || isComposing) return;            // 组字期间绝不干预
  try {
    const sel = window.getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return; // 只处理光标态，用户选中态不碰
    if (document.activeElement !== editor) return;
    // 只动样式，绝不动选区。
    // 曾试过在此 removeAllRanges()+addRange() 重设同位置以重启闪烁相位，
    // 结果打断了 Chromium 的撤销事务分组 → Ctrl+Z 失效（探针 A4 由 11/11 掉到 9/11）。
    // 教训同 F9：任何看似“无副作用”的选区/DOM 干预都可能连锁破坏 undo 栈。
    const prev = editor.style.caretColor;
    editor.style.caretColor = 'transparent';
    requestAnimationFrame(() => {
      try { editor.style.caretColor = prev || ''; } catch (e) {}
    });
  } catch (e) {}
}

// F12：光标落在「不可绘制」位置（如 \r\n 换行符中间、空文本节点内），
// 导致 getClientRects()=0 → Chromium 无法计算caret绘制坐标 → 光标看不见（却能打字）。
// 策略：在同块内向前/向后搜索最近的有可见 rect 的文本偏移；找不到就跨块。
function relocateCaretToVisible(range) {
  if (!range || !editor) return;
  const sel = window.getSelection();
  // F13 回归修复：刚回车产生的「空块」里，Chromium 的 getClientRects() 对空块
  // 折叠光标返回 0（但光标位置完全合法，只是 API 怪癖，实际能画出光标）。
  // 若光标所在块没有任何「非空文本」→ 这是「空块光标」，不是「坏偏移」，
  // 绝不应 relocate，否则会跨块把它拽到相邻有字的地方（如第一行），
  // 违背浏览器原生落点。F12 原场景的块含「四五六」→ 非空 → 仍走 relocate。
  const blk0 = (range.startContainer.nodeType === 1)
    ? range.startContainer
    : (range.startContainer.parentElement || null);
  let blockEl = blk0;
  while (blockEl && blockEl !== editor &&
         blockEl.tagName !== 'DIV' && blockEl.tagName !== 'P') {
    blockEl = blockEl.parentElement;
  }
  if (blockEl && blockEl !== editor) {
    const tw = document.createTreeWalker(blockEl, NodeFilter.SHOW_TEXT);
    let hasVisible = false;
    while (tw.nextNode()) {
      if (tw.currentNode.nodeValue && tw.currentNode.nodeValue.trim()) { hasVisible = true; break; }
    }
    if (!hasVisible) return; // 空块光标 → 保持原生落点，不 relocate
  }
  // 从当前起点开始，在编辑器内广度优先搜索一个 getClientRects()>0 的折叠位置
  const container = range.startContainer;
  const offset = range.startOffset;

  // 候选位置生成器：当前偏移±1→同节点其他偏移→兄弟文本节点→其他块
  const candidates = [];

  // 1. 当前文本节点内：尝试 offset±1, ±2, ... (避开换行符中间)
  if (container.nodeType === 3 && container.nodeValue) {
    const len = container.nodeValue.length;
    for (let i = 1; i <= Math.min(len, 4); i++) {
      if (offset + i <= len) candidates.push([container, offset + i]);
      if (offset - i >= 0) candidates.push([container, offset - i]);
    }
    // 也试节点首尾
    candidates.push([container, 0]);
    candidates.push([container, len]);
  }

  // 2. 同块内的其他文本节点
  let block = (container.nodeType === 1) ? container : container.parentElement;
  while (block && block !== editor && block.tagName !== 'DIV' && block.tagName !== 'P') block = block.parentElement;
  if (block && block !== editor) {
    const tw = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (tw.nextNode()) nodes.push(tw.currentNode);
    for (const n of nodes) {
      if (n === container) continue;
      if (n.nodeValue && n.nodeValue.trim()) {
        candidates.push([n, 0]);       // 节点开头（跳过纯空白前缀）
        candidates.push([n, n.nodeValue.length]); // 节点末尾
      }
    }
  }

  // 3. 其他块的首个非空文本节点
  if (block && block !== editor) {
    let sibling = block.nextSibling;
    let count = 0;
    while (sibling && count < 3) {
      const tw2 = document.createTreeWalker(sibling, NodeFilter.SHOW_TEXT);
      while (tw2.nextNode()) {
        const n = tw2.currentNode;
        if (n.nodeValue && n.nodeValue.trim()) { candidates.push([n, 0]); break; }
      }
      sibling = sibling.nextSibling; count++;
    }
    sibling = block.previousSibling;
    count = 0;
    while (sibling && count < 3) {
      const tw2 = document.createTreeWalker(sibling, NodeFilter.SHOW_TEXT);
      while (tw2.nextNode()) {
        const n = tw2.currentNode;
        if (n.nodeValue && n.nodeValue.trim()) { candidates.push([n, n.nodeValue.length]); break; }
      }
      sibling = sibling.previousSibling; count++;
    }
  }

  // 逐个尝试，取第一个 rects>0 的
  for (const [node, off] of candidates) {
    try {
      const tr = document.createRange();
      tr.setStart(node, off);
      tr.collapse(true);
      if (tr.getClientRects().length > 0) {
        setCaret(tr.startContainer, tr.startOffset);
        return; // 成功重定位到可见位置
      }
    } catch (e) { /* 某些偏移可能非法（如 Element 节点越界），跳过 */ }
  }

  // 所有候选都失败 → 回退到 ensureBlockWrapped + 末尾重建（与非法选区路径相同）
  ensureBlockWrapped();
  const last = editor.lastChild;
  const fr = document.createRange();
  if (last) {
    const tw = document.createTreeWalker(last, NodeFilter.SHOW_TEXT);
    let t = null; while (tw.nextNode()) t = tw.currentNode;
    if (t) fr.setStart(t, t.length);
    else fr.setStart(last, last.childNodes.length);
  } else { fr.setStart(editor, 0); }
  fr.collapse(true);
  try { setCaret(fr.startContainer, fr.startOffset); } catch (e) {}
}

function ensureCaret(forceRepaint) {
  if (!editor || isComposing) return;
  const sel = window.getSelection();
  const valid = sel.rangeCount > 0 &&
    sel.getRangeAt(0).startContainer.isConnected &&
    editor.contains(sel.getRangeAt(0).commonAncestorContainer);
  if (valid) {
    // 选区合法 → 进一步检查光标是否有可绘制的屏幕位置。
    // F12 根因：用户选中一行按空格后，选区合法(connected/inEditor/collapsed)，
    // 但 getClientRects()=0、bcr=0,0,0,0 —— 光标落在 \r\n 换行符中间，
    // Chromium 无法计算绘制坐标 → 光标看不见（却能打字，因为插入点逻辑上存在）。
    if (sel.isCollapsed && sel.rangeCount > 0) {
      const r = sel.getRangeAt(0);
      if (r.getClientRects().length === 0) {
        // 光标在"不可绘制"位置 → 挪到同块内最近的可见文本偏移
        relocateCaretToVisible(r);
        return; // 已重定位，无需再 repaint
      }
    }
    if (forceRepaint) repaintCaret();
    return;
  }
  // 选区非法：先确保块结构合法（裸文本节点会让光标再次失效），再在“末尾”重建折叠光标。
  // 折叠光标优先落在最后一个文本节点内（最贴近浏览器原生落点，Chromium 必绘制）；
  // 找不到文本节点（空块/空编辑器）则落在块/编辑器本身末尾。
  ensureBlockWrapped();
  if (document.activeElement !== editor) { try { editor.focus(); } catch (e) {} }
  const r = document.createRange();
  const last = editor.lastChild;
  if (last) {
    const tw = document.createTreeWalker(last, NodeFilter.SHOW_TEXT);
    let t = null; while (tw.nextNode()) t = tw.currentNode;
    if (t) r.setStart(t, t.length);
    else r.setStart(last, last.childNodes.length);
  } else {
    r.setStart(editor, 0);
  }
  r.collapse(true);
  try { setCaret(r.startContainer, r.startOffset); } catch (e) {}
}

editor.addEventListener('input', (e) => {
  const it = (e && e.inputType) || '';
  if (busy) {
    // I4：保存进行中（网络慢时可达数秒）的输入不再被丢弃——
    // 标记 pendingResave，本轮 saveLocal 完成后（finally）补挂保存；
    // 撤销栈照常记录，避免连续输入中出现撤销断档。
    pendingResave = true;
    if (it !== 'historyUndo' && it !== 'historyRedo') {
      clearTimeout(linkifyTimer);
      linkifyTimer = setTimeout(linkifyEditor, 500);
      try { recordIfChanged(it); } catch (e2) {}
    }
    return;
  }
  // 只有删除类输入（以及粘贴/程序化派发）才做首尾空行清理。
  // 插入类输入尤其是回车(insertParagraph/insertLineBreak)绝不清理，
  // 否则刚换出来的空行会被立刻删掉，用户看到的就是"回车无反应"(bug 4)。
  // 注意：historyUndo / historyRedo 绝不参与首尾空行清理，也不触发 linkify。
  // 在撤销事务内部再跑 cleanup / linkify 的 DOM 手术会破坏原生撤销栈（cleanup 删空白块、
  // linkify 的选区重设打断撤销事务分组），导致 Ctrl+Z“按了没反应”或错位。
  const needCleanup = it.indexOf('delete') === 0 || it === 'insertFromPaste' || (it === '' && !skipCleanupOnce);
  skipCleanupOnce = false;
  if (needCleanup) cleanupLeadingTrailingBreaks();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLocal, 800);
  // 撤销/重做后不挂 linkify：避免紧接着的程序化 DOM 手术污染/打断刚完成的撤销状态
  if (it !== 'historyUndo' && it !== 'historyRedo') {
    clearTimeout(linkifyTimer);
    linkifyTimer = setTimeout(linkifyEditor, 500);
  }
  // 用户真实编辑记入自管撤销栈；程序化改动（linkify/poll）不在此路径，由 syncCurrentState 同步
  if (it !== 'historyUndo' && it !== 'historyRedo') {
    recordIfChanged(it);
  }
});

// ── 回车处理：空块/空编辑器也能正常换行 ─────────────────────────────
// contenteditable 在空块（仅 <br>）里按回车常常"什么都不做"，无法连续空行。
// 仅在当前块为空时拦截并手动插入一个新空块；非空块交给浏览器默认换行
// （linkify 的块内选区恢复会把光标留在正确位置，见 bug 3 修复）。
function currentBlock(node) {
  let n = node;
  while (n && n !== editor) {
    if (n.nodeType === 1 && (n.tagName === 'DIV' || n.tagName === 'P')) return n;
    n = n.parentNode;
  }
  return editor;
}
function isBlockEmpty(block) {
  if (block === editor) {
    return editor.textContent.replace(/\u200B/g, '').trim() === '' && !editor.querySelector('img,a,s');
  }
  if (block.querySelector('img')) return false;
  return block.textContent.replace(/\u200B/g, '').trim() === '';
}
function placeCaretInBlock(block) {
  const sel = window.getSelection();
  const r = document.createRange();
  r.setStart(block, 0);
  r.collapse(true);
  setSel(r);
}
// 在链接文本中间回车时，insertParagraph 会把一个 <a> 劈成两个 href 相同的链接，
// 于是第二行的链接文字与 href 对不上（显示 "def"，href 却是完整 URL），
// 且在其中间继续打字会被吞进链接里。检测到"相邻同 href 的拆分链接"就展平成纯文本，
// 交给 500ms 后的 linkify 按新文本重建正确的链接。
function flattenSplitLink() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const blk = currentBlock(sel.getRangeAt(0).startContainer);
  if (!blk || blk === editor) return;
  const head = blk.firstChild;
  if (!head || head.nodeType !== 1 || head.tagName !== 'A' || !head.dataset || head.dataset.url !== '1') return;
  const href = head.getAttribute('href');
  // 找前一段：可能是上一个块的最后一个子节点，也可能是同级紧邻的 <a>（首行不带 div 时）
  let prevA = null;
  const prev = blk.previousSibling;
  if (prev && prev.nodeType === 1) {
    if (prev.tagName === 'A') prevA = prev;
    else {
      const lc = prev.lastChild;
      if (lc && lc.nodeType === 1 && lc.tagName === 'A') prevA = lc;
    }
  }
  if (!prevA || !prevA.dataset || prevA.dataset.url !== '1' || prevA.getAttribute('href') !== href) return;
  // 确认是拆分产物才动手，避免误伤两条恰好同 href 的独立链接
  const t1 = document.createTextNode(prevA.textContent.replace(/\u200B/g, ''));
  prevA.replaceWith(t1);
  const t2 = document.createTextNode(head.textContent.replace(/\u200B/g, ''));
  head.replaceWith(t2);
  const r = document.createRange();
  r.setStart(t2, 0);
  r.collapse(true);
  setSel(r);
}
editor.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.metaKey || e.ctrlKey) return;
  if (e.shiftKey) return; // 软换行 <br>，交给浏览器
  e.preventDefault();
  // 用 insertParagraph 可靠换行：contenteditable 内部换行本就走它，能正确处理
  // 空行、行内元素(<a>/<s>)拆分、跨块边界，避免"空编辑器/行尾按回车无反应"(bug 4)。
  // 它会派发带 inputType='insertParagraph' 的原生 input 事件，故这里不再手动 dispatch，
  // 否则 inputType 为空会误触发首尾空行清理，把刚换出来的行删掉。
  let ok = false;
  try { ok = document.execCommand('insertParagraph'); } catch (err) {}
  if (ok) { try { flattenSplitLink(); } catch (err) {} }
  if (!ok) {
    // 兜底：手动插入空块（极少数不支持 execCommand 的环境）
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const block = currentBlock(sel.getRangeAt(0).startContainer);
    const nb = document.createElement('div');
    nb.innerHTML = '<br>';
    if (block === editor) editor.appendChild(nb); else block.after(nb);
    placeCaretInBlock(nb);
    skipCleanupOnce = true;
    editor.dispatchEvent(new Event('input'));
  }
});

// ── 块内偏移保存/恢复（linkify 专用）──────────────────────────────────
// 以"块元素（DIV/P 或编辑器根）"为作用域保存/恢复光标，避免全局偏移在跨块边界时
// 把光标落到上一行末尾（bug 3：回车后光标跳到上一行右侧）。块元素在 linkify 重建
// 文本节点时引用不变，故可作为稳定的恢复锚点。
function blockOf(node, root) {
  let n = node;
  while (n && n !== root) {
    if (n.nodeType === 1 && (n.tagName === 'DIV' || n.tagName === 'P')) return n;
    n = n.parentNode;
  }
  return root;
}
function localOffsetInBlock(block, container, offset) {
  const pre = document.createRange();
  pre.selectNodeContents(block);
  try { pre.setEnd(container, offset); } catch (e) { return 0; }
  return visibleLen(pre.toString());
}
function saveSelectionBlocked(root, range) {
  const sb = blockOf(range.startContainer, root);
  const eb = blockOf(range.endContainer, root);
  return {
    startBlock: sb, endBlock: eb,
    start: localOffsetInBlock(sb, range.startContainer, range.startOffset),
    end: localOffsetInBlock(eb, range.endContainer, range.endOffset)
  };
}
function placeInBlock(block, localOff) {
  const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  let pos = 0, node = null, off = 0;
  while (walker.nextNode()) {
    const n = walker.currentNode;
    const vlen = visibleLen(n.nodeValue);
    if (pos + vlen >= localOff) {
      node = n;
      off = visibleToRealOffset(n, localOff - pos);
      break;
    }
    pos += vlen;
  }
  if (node) return { node, offset: off };
  if (block.nodeType === 1) return { node: block, offset: 0 };
  return null;
}
function restoreSelectionInBlock(root, saved) {
  const s = placeInBlock(saved.startBlock, saved.start);
  const e = placeInBlock(saved.endBlock, saved.end);
  if (!s || !e) return null;
  const r = document.createRange();
  try { r.setStart(s.node, s.offset); r.setEnd(e.node, e.offset); }
  catch (err) { return null; }
  return r;
}

async function saveLocal() {
  clearTimeout(saveRetryTimer); saveRetryTimer = null;
  const html = editor.innerHTML;
  if (html === lastHtml) return;
  busy = true; setStatus(false, '保存中…');
  try {
    const { ct, iv } = await encryptText(html, cryptoKey);
    const r = await apiPut({ ct, iv, salt: bufToB64(serverSalt) });
    localVer = r.v; lastHtml = html;
    saveRetryCount = 0;
    setStatus(true, '已同步');
  } catch (e) {
    if (e.locked) { setStatus(false, '已锁定，请稍后'); editor.contentEditable = false; }
    else {
      setStatus(false, '保存失败');
      scheduleSaveRetry(); // I4：失败自动退避重试，不再“失败即永久丢失，须手动再改一笔”
    }
  }
  finally {
    busy = false;
    // I4：保存期间（busy）的输入只做了标记，这里补挂一次保存把它真正写出去
    if (pendingResave) {
      pendingResave = false;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveLocal, 300);
    }
  }
}

// I4：保存失败退避重试。内容仍在编辑器里（html !== lastHtml），重试只是重新加密上传当前内容；
// 成功即停（saveLocal 成功分支清零计数），达到上限则保持“保存失败”状态等待用户下一次编辑触发。
function scheduleSaveRetry() {
  if (saveRetryCount >= SAVE_RETRY_DELAYS.length) return;
  const delay = SAVE_RETRY_DELAYS[saveRetryCount++];
  clearTimeout(saveRetryTimer);
  saveRetryTimer = setTimeout(() => { saveRetryTimer = null; saveLocal(); }, delay);
}

// I4：切后台/关页前把未保存内容尽力写出（best-effort：saveLocal 是异步的，
// 页面被系统立即杀掉时仍可能丢最后一笔，但常态下显著收窄丢失窗口）
function flushDirtySave() {
  if (!cryptoKey || busy) return;
  if (editor.innerHTML === lastHtml) return;
  saveLocal();
}

async function poll() {
  if (busy) return;
  if (!cryptoKey) return; // 已锁定：无密钥无须轮询，避免“同步中断”噪声
  try {
    const note = await apiGet();
    setStatus(true, '已同步');
    if ((note.v || 0) > localVer && note.ct) {
      const html = await decryptText(note.ct, note.iv, cryptoKey);
      // 本机有未保存改动时（editor.innerHTML !== lastHtml 且正聚焦），不覆盖编辑器，
      // 否则会丢失正在输入的内容、并导致光标消失（见 BUG_CHECKLIST E1）。
      const dirty = document.activeElement === editor && editor.innerHTML !== lastHtml;
      if (dirty) { localVer = note.v; return; }
      if (html !== editor.innerHTML) {
        const wasFocused = document.activeElement === editor;
        // 用字符偏移保存光标，而非 cloneRange：替换 innerHTML 后旧 Range 指向的节点被 detach，
        // 用 sel.rangeCount>0 判断恢复会失败（选区已空），必须用偏移重建（见 BUG_CHECKLIST E1）。
        let savedOffsets = null;
        if (wasFocused) {
          const sel = window.getSelection();
          if (sel.rangeCount > 0) {
            const r = sel.getRangeAt(0);
            if (editor.contains(r.commonAncestorContainer)) {
              try { savedOffsets = saveSelectionOffsets(editor, r); } catch (e) {}
            }
          }
        }
        lastHtml = html;
        // 远端内容覆盖：直接替换 innerHTML。原生撤销栈已被"自建撤销栈"取代，
        // 不再需要 contentEditable toggle——实测它切回可编辑态会清空整个原生撤销栈，
        // 反而让 Ctrl+Z 彻底失效（Bug A 的另一种诱因）。
        editor.innerHTML = html;
        linkifyEditor({ keepSelection: false });
        if (wasFocused && savedOffsets) {
          editor.focus();
          const sel = window.getSelection();
          const newRange = restoreSelectionOffsets(editor, savedOffsets.start, savedOffsets.end);
          if (newRange) {
            setSel(newRange);
          } else {
            // 兜底：远端内容比本机短时偏移越界，把光标放到内容末尾，避免丢失
            const r = document.createRange();
            r.selectNodeContents(editor);
            r.collapse(false);
            setSel(r);
          }
        }
        // 远端同步是程序化改动：同步撤销栈当前状态，避免把同步重渲染混入用户撤销序列
        syncCurrentState();
      }
      localVer = note.v;
    }
  } catch (e) {
    if (e.locked) setStatus(false, '已锁定');
    else setStatus(false, '同步中断');
  }
}

// SSE 推送（仅作即时加速器）+ 无条件常驻轮询基线 + 断线自动重连
// 关键修复（v5.17）：此前轮询兜底被 onopen 清掉、且只在 onerror 时才启动——
// 当 SSE 在 Cloudflare 隧道/代理下“连上但不投递”悬挂时，onerror 永不触发，轮询永不启动，
// 另一端既收不到推送也没人轮询，只能手动刷新（见 BUG_CHECKLIST 同步段）。
// 现改为：轮询是无条件常驻基线（每 2 秒，恢复 v2.x 体感），SSE 只负责“收到推送→立即拉一次”加速；
// 无论 SSE 是否可用，均 ≤2 秒自愈，彻底消除“必须刷新”。
let sseSource = null, pollTimer = null, sseReconnectTimer = null;
const POLL_INTERVAL = 2000;

function connectSSE() {
  try {
    sseSource = new EventSource('/api/note/' + encodeURIComponent(noteId) + '/stream');
    // onopen 不再 clearInterval(pollTimer)：轮询基线始终运行，SSE 仅是加速器
    sseSource.onopen = () => {};
    sseSource.onmessage = e => { poll(); };
    sseSource.onerror = () => {
      if (sseSource) { sseSource.close(); sseSource = null; }
      // 断线立即拉一次（轮询兜底本就常驻，无需在此启动），并尝试重连
      poll();
      if (!sseReconnectTimer) {
        sseReconnectTimer = setTimeout(() => {
          sseReconnectTimer = null;
          connectSSE();
        }, 5000);
      }
    };
  } catch (e) {
    // EventSource 构造失败：轮询基线由 startSync 保证运行，无需在此处理
  }
}

function startSync() {
  // 无条件常驻轮询基线：即便 SSE 在隧道下完全沉默，也 ≤2 秒自愈
  if (!pollTimer) { pollTimer = setInterval(poll, POLL_INTERVAL); }
  connectSSE();
  poll();
}

// 设备从后台切回前台时立即拉一次，避免回前台还要等下一拍；
// I4：切到后台/关页前先把未保存内容尽力写出（手机上切走应用很常见，不能只等 800ms 定时器）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') poll();
  else flushDirtySave();
});
window.addEventListener('pagehide', flushDirtySave);

$('#ok').addEventListener('click', () => unlock(pw.value));
pw.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(pw.value); });
pw.addEventListener('input', () => { $('#ok').disabled = pw.value.length === 0; });
$('#lock').addEventListener('click', () => {
  localStorage.removeItem(KEY_STORE); cryptoKey = null;
  undoStack = []; redoStack = []; lastState = null; // 退出锁定：清空撤销栈
  editor.innerHTML = ''; editor.contentEditable = false;
  mask.classList.remove('hidden'); pw.value = ''; err.textContent = '';
  $('#ok').disabled = true; // 退出锁定：清空口令后解锁按钮必须回到禁用态
  setStatus(false, '已退出');
});

(async function init() {
  if (!noteId) {
    // 根路径：显示极简首页，不跳转
    loadingEl.classList.add('hidden');
    document.getElementById('landing').classList.remove('hidden');
    const li = document.getElementById('landingInput'), lb = document.getElementById('landingBtn');
    const warnEl = document.getElementById('landingWarn');
    const syncOpenBtn = () => { lb.disabled = li.value.trim().length === 0; };
    const sanitizeName = () => {
      // v5.19 恢复 _ 与 -（与后端 ID_RE 一致）；中文等其它字符仍被剔除
      const cleaned = li.value.replace(/[^A-Za-z0-9_-]/g, '');
      if (cleaned !== li.value) {
        li.value = cleaned;
        if (warnEl) warnEl.classList.remove('hidden');
      } else if (warnEl) {
        warnEl.classList.add('hidden');
      }
      syncOpenBtn();
    };
    li.addEventListener('input', sanitizeName);
    li.addEventListener('compositionend', sanitizeName);
    syncOpenBtn();
    lb.addEventListener('click', () => {
      const name = li.value.trim();
      if (name) location.href = '/' + encodeURIComponent(name);
    });
    li.addEventListener('keydown', e => { if (e.key === 'Enter') lb.click(); });
    return;
  }
  // v5.20 二维码快速配对：地址栏带 #k=<密钥> 时直接解锁（密钥走 fragment、不经过服务器）
  try { if (await tryPairingUnlock()) return; }
  catch (e) { /* 锁定/非法名/断网：继续走下方正常流程显示对应提示 */ }
  if (await loadStoredKey()) {
    let note;
    try { note = await apiGet(); }
    catch (e) {
      loadingEl.classList.add('hidden');
      if (e.locked) {
        setStatus(false, '已锁定');
        mask.classList.remove('hidden');
        err.textContent = '尝试过多，请 ' + fmtRetry(e.retryAfter) + ' 后再试';
        return;
      }
      if (e.status === 400) {
        setStatus(false, '笔记名不合法');
        mask.classList.remove('hidden');
        err.textContent = '笔记名不合法（仅英文、数字、下划线、短横线）';
        return;
      }
      setStatus(false, '无法连接');
      mask.classList.remove('hidden');
      pw.focus();
      return;
    }
    serverSalt = note.salt ? b64ToBuf(note.salt) : null;
    if (!serverSalt) {
      loadingEl.classList.add('hidden');
      mask.classList.remove('hidden');
      pw.focus();
      return;
    }
    localVer = note.v || 0;
    loadingEl.classList.add('hidden');
    editor.contentEditable = true;
    if (note.ct) { try { lastHtml = await decryptText(note.ct, note.iv, cryptoKey); editor.innerHTML = lastHtml; } catch (e) {} }
    ensureBlockWrapped();
    if (note.ct) { try { linkifyEditor(); } catch (e) {} }
    ensureCaret(); // 自动加载后显式重建合法折叠光标
    undoStack = []; redoStack = []; lastState = captureState(); // 新笔记会话：清空并重置撤销栈基线
    startSync();
  } else {
    loadingEl.classList.add('hidden');
    mask.classList.remove('hidden');
    pw.focus();
  }
})();
// PWA Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
